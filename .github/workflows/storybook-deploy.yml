name: Storybook CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  storybook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Start Storybook in the background
        run: npm run storybook & npx wait-on http://localhost:6006

      - name: Capture Storybook Screenshots
        run: npx playwright test tests/storybook-screenshots.spec.js

      - name: Upload Storybook Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: storybook-screenshots
          path: "*.png"