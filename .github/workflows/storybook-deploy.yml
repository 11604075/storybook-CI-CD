name: Storybook CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  storybook-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Start Storybook in the Background
        run: npm run storybook & npx wait-on http://localhost:6006

      - name: Run Playwright Tests (Screenshot Comparison)
        run: npx playwright test

      # Automatically update snapshots if test fails
      - name: Update Snapshots if Needed
        if: failure()
        run: npx playwright test --update-snapshots

      # Upload updated snapshots as artifacts
      - name: Upload Updated Snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: tests/storybook-screenshots.spec.js-snapshots/

      # Fail the workflow if snapshots were updated
      - name: Fail if Snapshots Changed
        if: failure()
        run: exit 1
