name: Storybook CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  storybook-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Start Storybook in the Background
        run: npm run storybook & npx wait-on http://localhost:6006

      - name: Run Playwright Tests (Screenshot Comparison)
        id: test
        run: npx playwright test

      - name: Upload Screenshot Differences (if test fails)
        if: failure() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: tests/storybook-screenshots.spec.js-snapshots/  # Adjust this path if needed

      - name: Fail the Job if Snapshots Changed
        if: failure() || steps.test.outcome == 'failure'
        run: exit 1